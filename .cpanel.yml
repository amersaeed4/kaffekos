---
deployment:
  tasks:
    - export DEPLOYPATH=/home/hqpnorway/kaffekos.pk
    - /bin/mkdir -p $DEPLOYPATH/backup/before-last-deploy
    # keep one copy of the live pages and theme as they were before this deploy
    - /bin/rsync -a --delete $DEPLOYPATH/user/pages/ $DEPLOYPATH/backup/before-last-deploy/pages/
    - /bin/rsync -a --delete $DEPLOYPATH/user/themes/kaffekos/ $DEPLOYPATH/backup/before-last-deploy/theme/
    # deploy ONLY the pages and the Kaffekos theme (never core, plugins, config, accounts or data)
    - /bin/rsync -av --delete ./user/pages/ $DEPLOYPATH/user/pages/
    - /bin/rsync -av --delete --filter='P /images/**' ./user/themes/kaffekos/ $DEPLOYPATH/user/themes/kaffekos/