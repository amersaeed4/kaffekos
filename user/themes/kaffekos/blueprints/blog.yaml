title: Events Page
extends@: default

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            content:
              label: Introduction (optional)
            blog_help:
              type: spacer
              title: Adding an event
              text: 'Click the + next to Events in the page list, choose "Event Post" as the page type, write it up and set its Date on the Options tab (use the event date for events). Newest and upcoming ones show first.'
        banner:
          type: tab
          title: Page Banner
          fields:
            header.banner.image:
              type: filepicker
              label: Banner photo (optional)
              preview_images: true
              help: 'Wide photo behind the page title. Upload it on the first tab (Page Media) and pick it here. If empty, a warm navy banner with a Nordic pattern is shown.'
            header.banner.eyebrow:
              type: text
              label: Small line above the title
            header.banner.subtitle:
              type: textarea
              rows: 2
              label: Line under the title
