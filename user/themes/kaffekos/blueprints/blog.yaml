title: Journal Page
extends@: default

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            content:
              label: Introduction (optional)
            blog_help:
              type: spacer
              title: Posting news
              text: 'Click the + next to Journal in the page list, choose "Journal Post" as the page type, write your news and set a Date on its Options tab.'
        banner:
          type: tab
          title: Page Banner
          fields:
            header.banner.image:
              type: filepicker
              label: Banner photo (optional)
              preview_images: true
              help: 'Wide photo behind the page title. Upload it on the first tab (Page Media) and pick it here. If empty, a warm navy banner with a Nordic pattern is shown.'
            header.banner.eyebrow:
              type: text
              label: Small line above the title
            header.banner.subtitle:
              type: textarea
              rows: 2
              label: Line under the title
