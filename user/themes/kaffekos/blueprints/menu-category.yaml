title: Menu Category
extends@: default

form:
  fields:
    tabs:
      fields:

        banner:
          unset@: true
        content:
          title: Category & Photos
          fields:
            content:
              unset@: true
            header.title:
              label: Category name
              help: 'For example Coffee, Cold Drinks, Bakes, Breakfast.'
            header.description:
              type: textarea
              rows: 2
              label: Short description (optional)
            header.group:
              type: text
              label: Menu section
              help: 'Categories with the same section are grouped under one heading, with a switch at the top of the Menu page. For example Drinks or Sandwiches. Leave empty for no grouping.'
              placeholder: Drinks
            header.tone:
              type: select
              label: Colour style
              help: 'How this category looks on the Menu page.'
              default: blue
              options:
                blue: 'Blue heading, light rows'
                blue-solid: 'Blue heading, blue rows'
                red: 'Red heading, red rows'
                red-light: 'Red heading, light rows'
            header.decor:
              type: select
              label: Illustration (optional)
              help: 'A small drawing shown at the bottom of the category card.'
              default: ''
              options:
                '': None
                matcha-oslo: 'Matcha cup and stamp'
                cup-hug: 'Hugging a cup'
                chef: 'Chef on a croissant'
                norway: 'Norway stamp'
                sandwich-boy: 'Boy on a sandwich'
                sandwich-duo: 'Chef and walking sandwich'
        items:
          type: tab
          title: Menu Items
          fields:
            items_help:
              type: spacer
              title: Add items with the + button
              text: "Price: just type the number (e.g. 650), or write Small 450 / Large 600. Photos are chosen from this category's Page Media (first tab)."
            header.items:
              type: list
              label: Items
              style: vertical
              collapsed: true
              fields:
                .name:
                  type: text
                  label: Item name
                .price:
                  type: text
                  label: Price
                .description:
                  type: textarea
                  rows: 2
                  label: Description
                .image:
                  type: filepicker
                  label: Photo (optional)
                  preview_images: true
                .badge:
                  type: select
                  label: Label
                  default: ''
                  options:
                    '': None
                    New: New
                    Signature: Signature
                    Vegetarian: Vegetarian
                    Vegan: Vegan
                    Spicy: Spicy
                    Seasonal: Seasonal
                .featured:
                  type: toggle
                  label: Show on Home page
                  highlight: 0
                  default: 0
                  options:
                    1: 'Yes'
                    0: 'No'
                  validate:
                    type: bool
                .soldout:
                  type: toggle
                  label: Sold out / hide
                  highlight: 0
                  default: 0
                  options:
                    1: 'Hide it'
                    0: 'Available'
                  validate:
                    type: bool
