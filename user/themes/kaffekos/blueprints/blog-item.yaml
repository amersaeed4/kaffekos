title: Event Post
extends@: default

form:
  fields:
    tabs:
      fields:

        banner:
          unset@: true
        content:
          title: Post
          fields:
            content:
              label: Post text
            header.kind:
              type: select
              label: Type
              default: event
              options:
                event: 'Event'
                activity: 'Activity'
                news: 'News'
              help: 'Sets the coloured label on the card.'
            header.when:
              type: text
              label: When (optional)
              placeholder: 'Fri 17 Oct, 7 PM'
              help: 'Shown on the card, e.g. the day and time of the event.'
            header.where:
              type: text
              label: Where (optional)
              placeholder: 'Upstairs lounge'
            header.summary:
              type: textarea
              rows: 3
              label: Short summary
              help: 'Shown on the Events list and when the post is shared. 1–2 sentences.'
            header.cover:
              type: filepicker
              label: Cover photo
              preview_images: true
              help: 'Upload to Page Media first, then pick it here.'
            header.cover_focus:
              type: select
              label: Which part of the cover photo stays visible
              default: middle
              options:
                top: 'Top'
                upper: 'Upper part'
                middle: 'Middle'
                bottom: 'Bottom'
                full: 'Show the whole picture (for posters)'
              help: 'The photo is cropped to fit the card. For tall phone photos with people in them, "Top" or "Upper part" keeps faces in view. Choose "Show the whole picture" for a poster with text, so nothing gets cut off.'
            header.gallery:
              type: list
              style: vertical
              label: More photos (optional)
              help: 'Extra pictures shown under the post text, with an optional caption. Upload them to Page Media first.'
              fields:
                .image:
                  type: filepicker
                  label: Photo
                  preview_images: true
                .caption:
                  type: text
                  label: Caption
