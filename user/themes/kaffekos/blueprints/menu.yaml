title: Menu Page
extends@: default

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            content:
              label: Introduction (shown above the menu)
              help: 'Optional. A short welcome line for the menu.'
            menu_help:
              type: spacer
              title: How the menu works
              text: 'Each menu category (Hot Drinks, Shakes, Sandwiches, ...) is a sub-page of this page. Every item in it can be renamed, described, hidden or given a photo. In the page list, click the + next to Menu to add a category, and drag categories to reorder them. Items are added inside each category.'
        banner:
          type: tab
          title: Page Banner
          fields:
            header.banner.image:
              type: filepicker
              label: Banner photo (optional)
              preview_images: true
              help: 'Wide photo behind the page title. Upload it on the first tab (Page Media) and pick it here. If empty, a warm navy banner with a Nordic pattern is shown.'
            header.banner.eyebrow:
              type: text
              label: Small line above the title
            header.banner.subtitle:
              type: textarea
              rows: 2
              label: Line under the title

        options_menu:
          type: tab
          title: Menu Options
          fields:
            header.menu_options.show_images:
              type: toggle
              label: Show item photos
              highlight: 1
              default: 1
              options:
                1: 'Yes'
                0: 'No'
              validate:
                type: bool
            header.menu_options.show_prices:
              type: toggle
              label: Show prices
              help: 'Switch off to hide every price on the Menu page.'
              highlight: 1
              default: 1
              options:
                1: 'Yes'
                0: 'No'
              validate:
                type: bool
            header.menu_options.note:
              type: textarea
              rows: 3
              label: Note shown under the menu
              placeholder: 'All prices in PKR. Taxes may apply. Please tell us about any allergies.'
