name: Kaffekos
slug: kaffekos
type: theme
version: 1.0.0
description: Norwegian-inspired theme for the Kaffekos coffee house in Lahore. Every text, image, colour, opening hour and menu item is editable from the admin panel.
icon: coffee
author:
  name: Kaffekos
  email: info@kaffekos.pk
  url: https://kaffekos.pk
license: MIT
compatibility:
  grav: ['2.1']
dependencies:
  - { name: grav, version: '>=2.1.0' }

form:
  validation: loose

  fields:
    tabs:
      type: tabs
      active: 1

      fields:

        # ------------------------------------------------------------------ BRAND
        brand:
          type: tab
          title: Brand & Logo
          fields:
            brand_intro:
              type: spacer
              title: Logo, tagline and top-of-page elements

            custom_logo:
              type: file
              label: Logo
              help: Square or wide PNG / SVG with a transparent background. Replaces the default round Kaffekos mark.
              destination: 'theme://images/logo'
              multiple: false
              accept:
                - image/*

            custom_favicon:
              type: file
              label: Browser icon (favicon)
              help: Small square PNG, SVG or ICO (100 KB at most). Shown in the browser tab.
              filesize: 0.1
              destination: 'theme://images/favicon'
              multiple: false
              accept:
                - image/png
                - image/svg+xml
                - .ico

            brand.wordmark:
              type: text
              label: Name shown next to the logo
              default: Kaffekos

            brand.tagline:
              type: text
              label: Small line under the name
              default: 'Coffee, Comfort, Connection'

            header.cta_label:
              type: text
              label: Header button text
              help: The highlighted button on the right of the menu. Leave empty to hide it.
              default: Visit Us

            header.cta_url:
              type: text
              label: Header button link
              help: A page such as /contact, or a full web address.
              default: /contact

            announcement_title:
              type: spacer
              title: Announcement bar (top of every page)

            announcement.enabled:
              type: toggle
              label: Show announcement bar
              highlight: 0
              default: 0
              options:
                1: 'Yes'
                0: 'No'
              validate:
                type: bool

            announcement.text:
              type: text
              label: Announcement text
              placeholder: 'Fresh kanelboller every morning from 8 AM'

            announcement.link:
              type: text
              label: Announcement link (optional)
              placeholder: /menu

        # ------------------------------------------------------------- COLOURS
        colors:
          type: tab
          title: Colours
          fields:
            colors_intro:
              type: spacer
              title: Brand colours
              text: 'These colours are used across the whole site. The defaults come from the Kaffekos brand (Norwegian navy and red, coffee browns, warm cream).'

            colors.navy:
              type: colorpicker
              label: Deep navy (headings, dark sections)
              default: '#0f2747'

            colors.red:
              type: colorpicker
              label: Norwegian red (buttons, small accents)
              default: '#ba0c2f'

            colors.gold:
              type: colorpicker
              label: Gold (dividers, highlights)
              default: '#c99a5b'

            colors.cream:
              type: colorpicker
              label: Cream (page background)
              default: '#fbf6ec'

            colors.sand:
              type: colorpicker
              label: Sand (alternate section background)
              default: '#f1e6d2'

            colors.ink:
              type: colorpicker
              label: Coffee brown (body text)
              default: '#2b1a10'

        # --------------------------------------------------------- CONTACT
        contact:
          type: tab
          title: Contact & Location
          fields:
            contact_intro:
              type: spacer
              title: Shown in the footer, the Contact page, Google search results and map buttons

            business.phone:
              type: text
              label: Phone number
              default: '+92 300 8480123'

            business.whatsapp:
              type: text
              label: WhatsApp number
              help: International format, digits only, no + or spaces. Example 923008480123
              default: '923008480123'

            business.email:
              type: email
              label: Email address
              default: info@kaffekos.pk

            business.address:
              type: textarea
              label: Street address
              rows: 3
              help: Type it exactly as you want it displayed (new lines are kept).
              default: "Kaffekos, Grand Park\nBlock A, Phase 1, Johar Town\nLahore, Pakistan"

            business.maps_url:
              type: text
              label: Google Maps link
              help: The 'Get directions' buttons open this link.
              default: 'https://maps.app.goo.gl/PeZXekvmyz7heDNm9'

            business.lat:
              type: text
              label: Map latitude
              help: Used for the embedded map. Right-click your location in Google Maps and click the numbers to copy them.
              default: '31.4708125'

            business.lng:
              type: text
              label: Map longitude
              default: '74.3024827'

            business.directions_note:
              type: textarea
              rows: 2
              label: How to find us (optional)
              help: 'Landmarks and parking help people searching "cafe near me" and are shown with the address. Example: Opposite Grand Park, second floor, parking at the front.'

            business.price_range:
              type: text
              label: Price range (for Google)
              default: 'Rs. 300 - 1500'

        # ------------------------------------------------------ GOOGLE RATING
        google:
          type: tab
          title: Google Rating
          fields:
            google_intro:
              type: spacer
              title: Live Google rating on the Home page
              text: 'The rating and review count come from Google automatically. The API key and Place ID are kept out of the admin on purpose, in the file user/config/google-places.yaml on the server. If Google can''t be reached, the last good number (or the numbers typed on the Home page) are shown.'

            google.refresh_hours:
              type: number
              label: Refresh every (hours)
              default: 6
              size: x-small
              validate:
                type: int
                min: 1
                max: 168
              help: 'How often the site asks Google for fresh numbers. 6 = 4 times a day.'

            google.max_calls_per_day:
              type: number
              label: Maximum calls to Google per day
              default: 6
              size: x-small
              validate:
                type: int
                min: 1
                max: 100
              help: 'Hard safety limit, counted per day (Lahore time), including retries after a failed call. Keep it above 24 / refresh hours, otherwise the last refresh of the day is skipped. Google''s free allowance is about 1,000 calls a month.'

        # ----------------------------------------------------------- HOURS
        hours:
          type: tab
          title: Opening Hours
          fields:
            hours_intro:
              type: spacer
              title: Opening hours
              text: 'Use 24-hour times like 08:00 and 23:00. A time after midnight (for example 01:00) is fine. The site shows "Open now / Closed" automatically in Lahore time.'

            hours:
              type: list
              label: Days
              style: vertical
              collapsed: true
              fields:
                .day:
                  type: text
                  label: Day
                .open:
                  type: text
                  label: Opens (24h)
                  placeholder: '08:00'
                .close:
                  type: text
                  label: Closes (24h)
                  placeholder: '23:00'
                .closed:
                  type: toggle
                  label: Closed all day
                  highlight: 0
                  default: 0
                  options:
                    1: 'Yes'
                    0: 'No'
                  validate:
                    type: bool

            hours_note:
              type: text
              label: Note under the hours
              placeholder: 'Open during Ramadan: 4 PM - 1 AM'

        # --------------------------------------------------------- SOCIAL
        social:
          type: tab
          title: Social Media
          fields:
            social_intro:
              type: spacer
              title: Instagram, Facebook, TikTok, YouTube and LinkedIn icons always show in the footer. Until a link is added the icon is greyed out and not clickable. X only shows once a link is added.

            social.instagram:
              type: text
              label: Instagram link
              default: 'https://www.instagram.com/kaffekospakistan/'

            social.facebook:
              type: text
              label: Facebook link
              default: 'https://www.facebook.com/kaffekos'

            social.tiktok:
              type: text
              label: TikTok link

            social.youtube:
              type: text
              label: YouTube link

            social.linkedin:
              type: text
              label: LinkedIn link

            social.x:
              type: text
              label: X (Twitter) link

        # ------------------------------------------------------------- SEO
        seo:
          type: tab
          title: SEO & Keywords
          fields:
            seo_intro:
              type: spacer
              title: Site-wide search engine settings
              text: 'Used on every page. Each page can add its own title, description and keywords on its SEO tab; the page ones come first and these are added after them.'

            seo.keywords:
              type: textarea
              rows: 12
              label: Site-wide keywords
              help: 'Comma or new line separated. Added to every page as search keywords. Add new phrases at the end, for example a new product or a nearby area.'

            seo.title_suffix:
              type: text
              label: Title ending
              help: 'Added after the page name in the browser tab and Google, for pages without their own search title.'
              default: 'Norwegian Coffee Shop in Lahore'

            seo.description:
              type: textarea
              rows: 3
              label: Fallback description
              help: 'Used for any page that has no description of its own.'

            seo.area:
              type: text
              label: Area served
              help: 'Shown to Google as the neighbourhood and city of the shop.'
              default: 'Johar Town, Lahore'

        # ------------------------------------------------------- NORWEGIAN
        norwegian:
          type: tab
          title: Norwegian (Norsk)
          fields:
            norwegian_intro:
              type: spacer
              title: Norwegian version of the texts in the other tabs
              text: 'Shown to visitors who switch the website to Norwegian (EN / NO switch in the menu). If a field is left empty, the English text is shown instead. The other texts of the website are edited in Pages: choose the language at the top of the page editor.'

            brand.tagline_no:
              type: text
              label: Small line under the name (Norwegian)
              default: 'Kaffe, komfort, samhold'

            header.cta_label_no:
              type: text
              label: Header button text (Norwegian)
              default: 'Besøk oss'

            announcement.text_no:
              type: text
              label: Announcement text (Norwegian)

            hours_note_no:
              type: text
              label: Note under the opening hours (Norwegian)

            footer.about_no:
              type: textarea
              rows: 3
              label: Short text in the footer (Norwegian)
              default: 'Et lite stykke Norge i Lahore. Ærlig kaffe, varme bakverk og den typen koselige hjørner som får deg til å bli litt lenger.'

            footer.copyright_no:
              type: text
              label: Copyright line (Norwegian)
              default: 'Kaffekos. Alle rettigheter forbeholdt.'

            seo.title_suffix_no:
              type: text
              label: Title ending (Norwegian)
              default: 'Norsk kaffebar i Lahore'

            seo.description_no:
              type: textarea
              rows: 3
              label: Fallback description (Norwegian)
              default: 'Kaffekos er den norske kaffebaren i Lahore, med førsteklasses italienske Hausbrandt-kaffebønner, varme bakverk og nordisk kos i Johar Town.'

            seo.keywords_no:
              type: textarea
              rows: 6
              label: Site-wide keywords (Norwegian)
              help: 'Comma or new line separated.'
              default: 'norsk kaffebar i Lahore, norsk kafé, skandinavisk kafé, nordisk kaffehus, kos, Hausbrandt kaffe, italienske kaffebønner, kanelbolle, bakeri og kafé, Norwegian coffee shop Lahore, Hausbrandt coffee Lahore, Johar Town, Kaffekos'

        # --------------------------------------------------------- FOOTER
        footer:
          type: tab
          title: Footer & Shop
          fields:
            footer.about:
              type: textarea
              label: Short text in the footer
              rows: 3
              default: 'A small piece of Norway in Lahore. Honest coffee, warm bakes and the kind of cosy corner that makes you stay a little longer.'

            footer.copyright:
              type: text
              label: Copyright line
              default: 'Kaffekos. All rights reserved.'

            footer.tagline:
              type: text
              label: Small closing line
              default: 'Laget med kos i Lahore'

            shop_title:
              type: spacer
              title: Menu settings

            menu.currency:
              type: text
              label: Currency shown before menu prices
              default: 'Rs.'
